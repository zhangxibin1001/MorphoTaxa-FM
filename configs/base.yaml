project:
  name: MorphoTaxa_FM_PaperReady_v1
  output_root: outputs/paper
  seed: 42

data:
  root: /root/autodl-tmp/datasets
  image_size: 224
  workers: 8
  pin_memory: true

model:
  backbone: bioclip25
  embedding_dim: 1024
  normalize_features: true

train:
  amp: true
  epochs: 15
  batch_size: 24
  eval_batch_size: 96
  grad_accum_steps: 1
  label_smoothing: 0.0
  lr: 0.0001
  weight_decay: 0.05

report:
  metrics: [accuracy, balanced_accuracy, macro_precision, macro_recall, macro_f1, weighted_f1, top3, top5, ece, nll, brier]
