experiment:
  name: c1_smoke_portable
  stage: C1

model:
  freeze_backbone: true

  lora:
    enabled: true
    last_n_blocks: 8
    rank: 8
    alpha: 16.0
    dropout: 0.0
    targets: [qkv, proj]

  semantic:
    enabled: false

train:
  epochs: 1
  lr: 0.0001
  weight_decay: 0.05
  checkpoint_format: portable_task_v1
