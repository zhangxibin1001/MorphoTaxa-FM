[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphotaxa-fm"
version = "1.0.0"
description = "Paper-ready MorphoTaxa-FM research code"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0", "open-clip-torch>=2.24"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
